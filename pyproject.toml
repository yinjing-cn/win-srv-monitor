[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "win-srv-monitor"
version = "1.0.0"
description = "Lightweight Windows Server monitoring dashboard with Flask backend"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yin Jing"}]
requires-python = ">=3.10"
keywords = ["monitoring", "windows-server", "dashboard", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "Flask>=3.0,<4.0",
    "APScheduler>=3.10,<4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
win-srv-monitor = "monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
